name: Ruff & Flake8 Lint

on:
  # Trigger the workflow on pushes to the main branch
  push:
    branches: [ main ]
  # Trigger the workflow on pull requests targeting the main branch
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Run Ruff and Flake8
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # You can change this version if needed

      # Step 3: Install Ruff and Flake8
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      # Step 4: Run Ruff to lint your code
      - name: Run Ruff
        run: ruff check .

      # Step 5: Run Flake8 to lint your code
      - name: Run Flake8
        run: flake8 .
